[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
casino = "4nPbWQkPAnSWMnSCAsuNicCGA86zrQKjzkZX7JFWRREY"

[programs.devnet]
casino = "4nPbWQkPAnSWMnSCAsuNicCGA86zrQKjzkZX7JFWRREY"

[programs.mainnet]
casino = "4nPbWQkPAnSWMnSCAsuNicCGA86zrQKjzkZX7JFWRREY"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 900000

[test.validator]
# Concrete host IP (not 0.0.0.0 — Agave rejects UnspecifiedIpAddr).
# Apple Container ARX on 172.21.0.0/16 can reach en0; loopback is container-unreachable.
bind_address = "192.168.1.89"
gossip_port = 8020
warp_slot = 200

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

# CompDef accounts are initialized after localnet starts (`UPLOAD_COMP_DEFS=1`).
# Arcium CLI 0.14 does not write per-circuit `*_comp_def.json` genesis files, and
# preloading an offset into mxe_acc.json without that account makes
# init_comp_def fail with InvalidComputationDefinition.
