[package]
name = "light-casino"
version = "0.1.0"
edition = "2021"
description = "Pinocchio light-casino program"

[lib]
crate-type = ["cdylib", "lib"]
name = "light_casino"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["no-entrypoint"]
idl-build = []
# Allow skipping UsedPermutation Light CPI when remaining Light accounts are empty
# (Arcium-only E2E localnet has no Light indexer/prover). Production builds omit this.
testing = []

[dependencies]
light-sdk-pinocchio = { version = "0.23.0", features = ["light-account", "poseidon"] }
pinocchio = "0.9"
borsh = "0.10.4"
light-hasher = { version = "5.0.0", features = ["poseidon"] }
groth16-solana = "0.2.0"
solana-bn254 = "2"
light-poseidon = "0.3.0"
ark-bn254 = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
shared-zk-ids = { path = "../../../shared-zk-ids" }
pinocchio-idl-macros = "0.1.1"

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-sdk = "2.2"

[dev-dependencies]
light-client = { version = "0.23.0" }
light-program-test = { version = "0.23.0" }
tokio = "1.36.0"
ark-bn254 = "0.5"
ark-serialize = "0.5"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint", "testing"))',
]
