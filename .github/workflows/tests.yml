name: Tests

on:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      typecheck: ${{ steps.select.outputs.typecheck }}
      lean: ${{ steps.select.outputs.lean }}
      has_games: ${{ steps.select.outputs.has_games }}
      games: ${{ steps.select.outputs.games }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Select tests
        id: select
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          zero=0000000000000000000000000000000000000000
          if [ "$before" = "$zero" ]; then
            .github/select-tests.sh --all
          elif git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git diff --name-only "$before" HEAD | .github/select-tests.sh
          elif git fetch --depth=1 origin "$before"; then
            git diff --name-only "$before" HEAD | .github/select-tests.sh
          else
            .github/select-tests.sh --all
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lean:
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install Lean
        run: |
          set -eux
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the proofs
        working-directory: lean
        run: lake build

  games:
    name: ${{ matrix.game }} (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.has_games == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Free disk space
        run: |
          set -eux
          if [ "$RUNNER_OS" = "macOS" ]; then
            sudo rm -rf \
              /Library/Developer/CoreSimulator \
              "$HOME/Library/Developer/CoreSimulator" \
              "$HOME/Library/Developer/Xcode/DerivedData" \
              "$HOME/Library/Android" \
              /Users/runner/hostedtoolcache \
              /Applications/Xcode*.app/Contents/Developer/Platforms/AppleTVOS.platform \
              /Applications/Xcode*.app/Contents/Developer/Platforms/WatchOS.platform \
              /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform \
              /Applications/Xcode*.app/Contents/Developer/Platforms/WatchSimulator.platform \
              /Applications/Xcode*.app/Contents/Developer/Platforms/AppleTVSimulator.platform \
              /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneSimulator.platform
          else
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift
          fi
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Look for a passed run with a stored library
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/reuse-proof-artifact.py
          "${{ matrix.game }}"
          "${{ matrix.runner }}"
          "${{ matrix.test }}"
          "${{ matrix.lfs }}"
          "${{ matrix.circuit_set }}"

      - name: Download the stored macOS libraries
        if: steps.reuse.outputs.reuse == 'true' && runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: libzkcasino-macos-${{ matrix.circuit_set }}
          path: libzkcasino/zig-out/lib
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check the stored libraries
        if: steps.reuse.outputs.reuse == 'true' && runner.os == 'macOS'
        run: |
          set -eux
          find libzkcasino/zig-out/lib -type f -name '*.dylib' -print
          find libzkcasino/zig-out/lib -type f -name '*.dylib' | grep -q .

      - name: Reupload the stored libraries for this run
        if: steps.reuse.outputs.reuse == 'true' && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: libzkcasino-macos-${{ matrix.circuit_set }}
          if-no-files-found: error
          overwrite: true
          path: libzkcasino/zig-out/lib

      - name: Download the stored Linux libraries
        if: steps.reuse.outputs.reuse == 'true' && runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: libzkcasino-linux-${{ matrix.circuit_set }}
          path: libzkcasino/zig-out/lib
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check the stored Linux libraries
        if: steps.reuse.outputs.reuse == 'true' && runner.os == 'Linux'
        run: |
          set -eux
          find libzkcasino/zig-out/lib -type f -name '*.so' -print
          file libzkcasino/zig-out/lib/libzkcasino-player.so | grep -q 'x86-64'

      - name: Reupload the stored Linux libraries for this run
        if: steps.reuse.outputs.reuse == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: libzkcasino-linux-${{ matrix.circuit_set }}
          if-no-files-found: error
          overwrite: true
          path: libzkcasino/zig-out/lib

      - name: Install the prover
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          set -eux
          if [ "$RUNNER_OS" = "macOS" ]; then
            export HOMEBREW_NO_AUTO_UPDATE=1
            brew install gmp
            if ! command -v git-lfs >/dev/null 2>&1; then
              brew install git-lfs
            fi
            brew trust --tap IceColdCasino/groth16
            brew tap IceColdCasino/groth16 https://github.com/IceColdCasino/groth16
            brew install icecoldcasino/groth16/zkey
            zkey lib
          else
            sudo apt-get update
            sudo apt-get install -y g++ libgmp-dev git-lfs libc++1 libc++abi1
            bash .github/install-groth16.sh
          fi

      - uses: mlugg/setup-zig@v2
        if: steps.reuse.outputs.reuse != 'true'
        with:
          version: 0.17.0
          use-cache: false

      - name: Restore Zig cache
        id: zig-cache
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            libzkcasino/.zig-cache
            libzkcasino/zig-pkg
          key: zig-0.17.0-${{ runner.os }}-${{ runner.arch }}-${{ matrix.circuit_set }}
          restore-keys: |
            zig-0.17.0-${{ runner.os }}-${{ runner.arch }}-${{ matrix.circuit_set }}

      - name: Build libzkcasino
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: libzkcasino
        run: zig build -Doptimize=ReleaseFast -Dcircuit-set=${{ matrix.circuit_set }}

      - name: Upload macOS libzkcasino libraries
        if: steps.reuse.outputs.reuse != 'true' && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: libzkcasino-macos-${{ matrix.circuit_set }}
          if-no-files-found: error
          overwrite: true
          path: libzkcasino/zig-out/lib

      - name: Upload Linux libzkcasino libraries
        if: steps.reuse.outputs.reuse != 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: libzkcasino-linux-${{ matrix.circuit_set }}
          if-no-files-found: error
          overwrite: true
          path: libzkcasino/zig-out/lib

      - name: Save Zig cache
        if: steps.reuse.outputs.reuse != 'true' && steps.zig-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            libzkcasino/.zig-cache
            libzkcasino/zig-pkg
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

      - name: Drop the Zig cache
        if: steps.reuse.outputs.reuse != 'true'
        run: rm -rf .zig-cache libzkcasino/.zig-cache libzkcasino/zig-pkg "${HOME}/.cache/zig" "${HOME}/Library/Caches/zig"

      - uses: oven-sh/setup-bun@v2
        if: steps.reuse.outputs.reuse != 'true'

      - name: Pull proving keys for this game
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          set -eux
          git lfs install --local
          git lfs pull --include="${{ matrix.lfs }}"
          key=zkey/register_main_0001.zkey
          test -f "$key"
          if head -c 40 "$key" | grep -q "git-lfs.github.com"; then
            echo "zkey files are still Git LFS pointers. Push zkey/ before this job can prove."
            exit 1
          fi
          df -h /

      - run: bun install --frozen-lockfile
        if: steps.reuse.outputs.reuse != 'true'
      - name: Run proof tests
        if: steps.reuse.outputs.reuse != 'true'
        run: bash .github/run-proof-tests.sh "test/${{ matrix.test }}"

  rust-linux:
    name: Rust programs (linux)
    needs: changes
    if: needs.changes.outputs.has_games == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CASINO_EPHEMERAL_PROGRAM_IDS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Solana, Anchor, and Arcium
        run: bash .github/install-localnet-tools.sh
      - name: Build casino and light-casino for localnet
        run: |
          set -eux
          # Arcis images are linux/amd64. This runner is x86_64, so Docker is the runtime.
          export ARCIUM_USE_APPLE_CONTAINER=0
          export DOCKER_DEFAULT_PLATFORM=linux/amd64
          export CASINO_ALLOW_TESTING=1
          export CASINO_FEATURES=testing
          bash scripts/prepare-ephemeral-program-ids.sh
          bash rust/casino/scripts/build.sh
          (
            cd rust/light-casino
            unset CARGO_TARGET_DIR
            RUSTFLAGS='--cfg getrandom_backend="custom"' cargo build-sbf \
              --tools-version v1.54 \
              --manifest-path programs/light-casino/Cargo.toml \
              --features testing
          )
          deploy=rust/casino/target/deploy
          printf 'testing\n' > "${deploy}/.casino_features_testing"
          printf 'showdown-output-latch\n' > "${deploy}/.casino_cpi_bridge_v7"
          python3 -c 'import json; from datetime import datetime, timezone; from pathlib import Path; Path("rust/casino/target/deploy/casino-artifact-mode.json").write_text(json.dumps({"version":1,"mode":"testing","testing":True,"features":["testing"],"generatedAt":datetime.now(timezone.utc).isoformat()}, indent=2)+"\n")'
          printf 'testing\n' > rust/light-casino/target/deploy/.light_casino_features_testing
          for name in verify_deck_hash_chunk reveal_card validate_bet seal_showdown_pair compute_pots distribute_and_settle settle_casino_hand; do
            test -f "rust/casino/build/${name}.arcis"
          done
          test -f rust/casino/target/deploy/casino.so
          test -f rust/casino/target/idl/casino.json
          test -f rust/light-casino/target/deploy/light_casino.so
      - name: Stage localnet artifacts
        run: |
          set -eux
          stage="${GITHUB_WORKSPACE}/rust-localnet-artifact"
          mkdir -p \
            "${stage}/rust/casino/build" \
            "${stage}/rust/casino/target/deploy" \
            "${stage}/rust/casino/target/idl" \
            "${stage}/rust/light-casino/target/deploy"
          cp -a rust/casino/build/. "${stage}/rust/casino/build/"
          cp -a rust/casino/target/deploy/casino.so "${stage}/rust/casino/target/deploy/"
          cp -a rust/casino/target/deploy/.casino_features_testing "${stage}/rust/casino/target/deploy/"
          cp -a rust/casino/target/deploy/.casino_cpi_bridge_v7 "${stage}/rust/casino/target/deploy/"
          cp -a rust/casino/target/deploy/casino-artifact-mode.json "${stage}/rust/casino/target/deploy/"
          cp -a rust/casino/target/idl/casino.json "${stage}/rust/casino/target/idl/"
          cp -a rust/casino/target/deploy/casino-keypair.json "${stage}/rust/casino/target/deploy/"
          cp -a rust/light-casino/target/deploy/light_casino.so "${stage}/rust/light-casino/target/deploy/"
          cp -a rust/light-casino/target/deploy/.light_casino_features_testing "${stage}/rust/light-casino/target/deploy/"
          cp -a rust/light-casino/target/deploy/light_casino-keypair.json "${stage}/rust/light-casino/target/deploy/"
          echo "stage=${stage}" >> "${GITHUB_ENV}"
      - name: Upload localnet programs
        uses: actions/upload-artifact@v4
        with:
          name: rust-localnet-linux
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ env.stage }}

  macos-app:
    name: macOS app
    needs: [changes, games]
    if: >-
      always() &&
      needs.changes.outputs.has_games == 'true' &&
      needs.games.result == 'success' &&
      contains(needs.changes.outputs.games, 'poker')
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf \
            /Library/Developer/CoreSimulator \
            "$HOME/Library/Developer/CoreSimulator" \
            "$HOME/Library/Developer/Xcode/DerivedData" \
            "$HOME/Library/Android" \
            /Users/runner/hostedtoolcache
          df -h /
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download macOS libzkcasino libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libzkcasino-macos-*
          path: libzkcasino-parts
      - name: Install the downloaded libraries
        run: |
          set -eux
          mkdir -p libzkcasino/zig-out/lib
          find libzkcasino-parts -type f -exec cp -f {} libzkcasino/zig-out/lib/ \;
          test -f libzkcasino/zig-out/lib/libzkcasino-poker.dylib
          test -f libzkcasino/zig-out/lib/libzkcasino-shuffle-1-deck-52.dylib
          test -f libzkcasino/zig-out/lib/libfr.dylib
          test -f libzkcasino/zig-out/lib/libzkcasino.dylib
      - name: Install the prover
        run: |
          set -eux
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install gmp
          brew trust --tap IceColdCasino/groth16
          brew tap IceColdCasino/groth16 https://github.com/IceColdCasino/groth16
          brew install icecoldcasino/groth16/zkey
          zkey lib
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - name: Build the macOS app
        run: |
          set -eux
          lib="$(zkey lib)"
          test -f "${lib}"
          dest="$(cd "${GITHUB_WORKSPACE}/.." && pwd)/groth16/zig-out/lib"
          mkdir -p "${dest}"
          ln -sfn "${lib}" "${dest}/libgroth16.dylib"
          mkdir -p /tmp/zn
          npm init -y --prefix /tmp/zn >/dev/null
          npm install --prefix /tmp/zn zero-native@0.2.0
          cd app
          zig build -Doptimize=ReleaseFast -Dzero-native-path=/tmp/zn/node_modules/zero-native
          test -x zig-out/bin/app
      - uses: oven-sh/setup-bun@v2
      - name: Frontend tests
        run: |
          set -eux
          # Browser Anchor shims and @poker-src resolve through the repo-root
          # install. Frontend npm ci still owns vitest and the Vite app deps.
          bun install --frozen-lockfile
          npm --version
          npm ci --prefix app/frontend
          # Shared macOS runners are slower than a local Mac; decrypt and bridge
          # suites need headroom past vitest's 5s default.
          npm test --prefix app/frontend -- --testTimeout=120000

  # GitHub-hosted macOS runners cannot run Apple Container (no nested
  # Virtualization.framework — VZErrorDomain Code=2; actions/runner-images#9460).
  # Arcium localnet therefore runs on Linux Docker here; Apple Container remains
  # the supported path on bare-metal Macs.
  linux-arcium:
    name: Arcium 2p (linux)
    needs: [changes, games, rust-linux]
    if: >-
      always() &&
      needs.changes.outputs.has_games == 'true' &&
      needs.games.result == 'success' &&
      needs.rust-linux.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    env:
      CASINO_EPHEMERAL_PROGRAM_IDS: "1"
      # rust-linux already compiled casino.so, light_casino.so, and the .arcis
      # compdefs. This job only uploads those compdefs onto the localnet.
      CASINO_PREBUILT: "1"
      UPLOAD_COMP_DEFS: "1"
      LIGHT_GENESIS: "0"
      ARCIUM_USE_APPLE_CONTAINER: "0"
      DOCKER_DEFAULT_PLATFORM: "linux/amd64"
      # Host CLI / readiness probes use loopback (Agave rejects 0.0.0.0).
      # Containers reach RPC/WS via socat on the docker bridge gateway (see below).
      SOLANA_BIND_ADDRESS: "127.0.0.1"
      ARCIUM_DOCKER_HOST_GATEWAY: "172.17.0.1"
    steps:
      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift
          df -h /
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Download Linux localnet programs
        uses: actions/download-artifact@v4
        with:
          name: rust-localnet-linux
          path: .
      - name: Download Linux libzkcasino libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libzkcasino-linux-*
          path: libzkcasino-parts
      - name: Install the downloaded libraries and the prover
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y g++ libgmp-dev libc++1 libc++abi1
          bash .github/install-groth16.sh
          test -d libzkcasino-parts
          find libzkcasino-parts -type f -name '*.so' -print
          mkdir -p libzkcasino/zig-out/lib
          find libzkcasino-parts -type f -name '*.so' -exec cp -f {} libzkcasino/zig-out/lib/ \;
          test -f libzkcasino/zig-out/lib/libzkcasino-player.so
          test -f libzkcasino/zig-out/lib/libzkcasino-player-bridge.so
          file libzkcasino/zig-out/lib/libzkcasino-player.so | grep -q 'x86-64'
          if ldd libzkcasino/zig-out/lib/libzkcasino-player.so | grep -q 'not found'; then
            ldd libzkcasino/zig-out/lib/libzkcasino-player.so
            exit 1
          fi
          for name in verify_deck_hash_chunk reveal_card validate_bet seal_showdown_pair compute_pots distribute_and_settle settle_casino_hand; do
            test -f "rust/casino/build/${name}.arcis"
          done
          test -f rust/casino/target/deploy/casino.so
          test -f rust/casino/target/idl/casino.json
          test -f rust/light-casino/target/deploy/light_casino.so
          # light-casino IDL may live under idl/ or target/idl/ depending on build.
          if [ ! -f rust/light-casino/idl/light_casino.json ]; then
            test -f rust/light-casino/target/idl/light_casino.json
            mkdir -p rust/light-casino/idl
            cp -a rust/light-casino/target/idl/light_casino.json rust/light-casino/idl/
          fi
          test -f rust/casino/target/deploy/casino-keypair.json
          test -f rust/light-casino/target/deploy/light_casino-keypair.json
      - name: Install Solana, Anchor, and Arcium
        run: bash .github/install-localnet-tools.sh
      - name: Bind the checkout to this localnet's program ids
        run: |
          set -eux
          export PATH="${HOME}/.local/share/solana/install/active_release/bin:${PATH}"
          bash scripts/prepare-ephemeral-program-ids.sh --keep-keypairs
          python3 -c 'import os,time; now=time.time()+2; [os.utime(os.path.join(d,f),(now,now)) for r in ("rust/casino/build","rust/casino/target","rust/light-casino/target") for d,_,fs in os.walk(r) for f in fs]'
      - uses: oven-sh/setup-bun@v2
      - name: Pull proving keys
        env:
          GAMES: ${{ needs.changes.outputs.games }}
        run: |
          set -eux
          git lfs install --local
          includes=""
          for game in ${GAMES}; do
            case "${game}" in
              poker) pat='zkey/register_main*,zkey/shuffle_1_deck_52_main*,zkey/poker_*' ;;
              blackjack) pat='zkey/register_main*,zkey/shuffle_6_deck_52_main*,zkey/blackjack_*' ;;
              baccarat) pat='zkey/register_main*,zkey/shuffle_6_deck_52_main*,zkey/baccarat_*' ;;
              war) pat='zkey/register_main*,zkey/shuffle_6_deck_52_main*,zkey/war_*' ;;
              roulette) pat='zkey/register_main*,zkey/shuffle_1_deck_37_main*,zkey/shuffle_1_deck_38_main*,zkey/roulette_*' ;;
              craps) pat='zkey/register_main*,zkey/shuffle_2_dice_6_main*,zkey/craps_*' ;;
              keno) pat='zkey/register_main*,zkey/shuffle_1_deck_80_main*,zkey/keno_*' ;;
              slots) pat='zkey/register_main*,zkey/shuffle_3_reel_22_main*,zkey/shuffle_5_reel_22_main*,zkey/slot_*' ;;
              bingo) pat='zkey/register_main*,zkey/shuffle_1_deck_75_main*,zkey/shuffle_1_deck_90_main*,zkey/bingo_*' ;;
              *) echo "unknown game ${game}" >&2; exit 1 ;;
            esac
            if [ -n "${includes}" ]; then includes="${includes},"; fi
            includes="${includes}${pat}"
          done
          git lfs pull --include="${includes}"
          key=zkey/register_main_0001.zkey
          test -f "${key}"
          if head -c 40 "${key}" | grep -q "git-lfs.github.com"; then
            echo "zkey files are still Git LFS pointers."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: Pre-pull Arcium node images
        run: |
          set -eux
          docker version
          docker compose version
          for img in \
            arcium/trusted-dealer:v0.14.1 \
            arcium/arx-node:v0.14.1 \
            arcium/recovery-node:v0.14.1
          do
            docker pull --platform linux/amd64 "${img}"
          done
      - name: Arcium 2-player tests
        env:
          GAMES: ${{ needs.changes.outputs.games }}
          RUST_BACKTRACE: "1"
        run: |
          set -eux
          export PATH="${GITHUB_WORKSPACE}/scripts/bin:/tmp/arcium-0.14/bin:${HOME}/.local/bin:${HOME}/.cargo/bin:${HOME}/.local/share/solana/install/active_release/bin:${PATH}"
          export ARCIUM_USE_APPLE_CONTAINER=0
          export DOCKER_DEFAULT_PLATFORM=linux/amd64
          # scripts/bin/docker is the Apple Container shim. On this Linux runner
          # it must exec Docker Engine (/usr/bin/docker), not `container`.
          docker_bin="$(command -v docker)"
          echo "docker resolved to ${docker_bin}"
          case "${docker_bin}" in
            "${GITHUB_WORKSPACE}/scripts/bin/docker") ;;
            *) echo "expected the repo docker shim first on PATH" >&2; exit 1 ;;
          esac
          if docker version 2>&1 | grep -q 'apple-container'; then
            echo "docker shim is still talking to Apple Container" >&2
            exit 1
          fi
          docker info >/dev/null
          # Validator stays on 127.0.0.1 for arcium CLI websockets. Containers dial
          # the docker bridge gateway, so forward RPC (:8899) and pubsub (:8900).
          # Anchor treats any listener on 8899 as "rpc port already in use", so
          # the forwarder waits until the validator owns the loopback port.
          sudo apt-get update
          sudo apt-get install -y socat
          gateway="$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "${gateway}"
          export ARCIUM_DOCKER_HOST_GATEWAY="${gateway}"
          sudo pkill -f 'socat TCP-LISTEN:8899' || true
          sudo pkill -f 'socat TCP-LISTEN:8900' || true
          forward_when_ready() {
            local port="$1"
            sudo bash -c "
              for _ in \$(seq 1 2400); do
                if ss -ltn | grep -Eq '127\\.0\\.0\\.1:${port}([^0-9]|$)'; then
                  exec socat TCP-LISTEN:${port},bind=${gateway},fork,reuseaddr TCP:127.0.0.1:${port}
                fi
                sleep 0.5
              done
              echo 'validator did not listen on 127.0.0.1:${port}' >&2
              exit 1
            " &
          }
          forward_when_ready 8899
          forward_when_ready 8900
          for game in ${GAMES}; do
            bun test --max-concurrency=1 --timeout=1800000 "test/e2e/full-game-zk-arcis-${game}-2player.test.ts" \
              || {
                echo '==== docker ps ===='
                docker ps -a || true
                echo '==== compose (if present) ===='
                sed -n '1,120p' rust/casino/artifacts/docker-compose-arx-env.yml 2>/dev/null || true
                echo '==== trusted dealer config (rpc) ===='
                rg -n 'endpoint|host\.docker|172\.|8899|8900' rust/casino/artifacts/trusted_dealer_config.toml rust/casino/artifacts/node_config_*.toml 2>/dev/null || true
                exit 1
              }
          done
